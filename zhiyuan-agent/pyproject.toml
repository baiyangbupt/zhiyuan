[project]
name = "zhiyuan-agent"
version = "3.0.0"
description = "AI 高考志愿填报后端服务"
requires-python = ">=3.10"
dependencies = [
    "pydantic-ai-slim[openai,anthropic]>=0.2",
    "pydantic-ai-skills>=0.1",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "logfire>=2.0",
    "websockets>=12.0",
    "aiohttp>=3.9",
    "loguru>=0.7",
    "duckdb>=0.9.0",
    "pandas>=2.0",
    "aiofiles>=23.0",
    "mcp>=1.12,<2",
    "redis>=5.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-mock>=3.12",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "e2e: 端到端测试，需要真实 API key（使用 -m e2e 运行）",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
