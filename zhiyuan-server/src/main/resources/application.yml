spring:
  profiles:
    active: local
  flyway:
    enabled: true
    locations: classpath:db/migration
    table: flyway_schema_history
    baseline-on-migrate: true
    baseline-version: 1
    url: ${spring.datasource.dynamic.datasource.master.url}
    user: ${spring.datasource.dynamic.datasource.master.username}
    password: ${spring.datasource.dynamic.datasource.master.password}

evidence:
  ledger:
    # 证据保留窗口（天）。志愿填报是一个季度内完成的业务，30 天覆盖单次咨询周期。
    ttl-days: 30

planning:
  pending-command:
    retention:
      enabled: true
      fixed-delay-ms: 3600000
      retention-days: 30
      batch-size: 500
  data-freshness:
    schedule:
      enabled: false
      fixed-delay-ms: 300000
      batch-size: 5
      seed-batch-size: 10
      max-consecutive-tasks: 2
