spring:
  profiles:
    active: local
  flyway:
    enabled: true
    locations: classpath:db/migration
    table: flyway_schema_history
    baseline-on-migrate: true
    baseline-version: 1
    url: ${spring.datasource.dynamic.datasource.master.url}
    user: ${spring.datasource.dynamic.datasource.master.username}
    password: ${spring.datasource.dynamic.datasource.master.password}

evidence:
  ledger:
    # 证据保留窗口（天）。志愿填报是一个季度内完成的业务，30 天覆盖单次咨询周期。
    ttl-days: 30

planning:
  candidate-pool:
    split:
      # 池状态瘦身·切片1（2026-10-16 review §五-54）：true=候选池 items 拆到 planningCandidatePool
      # 行（写路径先 CAS 池行再写瘦 planningState 行；读闸口回填，对外形状不变）。
      # false=回内联（回滚位：整文档单行写，与拆分前同语义）。注意：拆后不可用旧 jar 直退。
      enabled: true
  pending-command:
    retention:
      enabled: true
      fixed-delay-ms: 3600000
      retention-days: 30
      batch-size: 500
  data-freshness:
    schedule:
      enabled: false
      fixed-delay-ms: 300000
      batch-size: 5
      seed-batch-size: 10
      max-consecutive-tasks: 2
