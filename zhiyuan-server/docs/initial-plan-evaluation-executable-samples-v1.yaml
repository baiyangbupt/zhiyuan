  - source_type
  - session_id
  - province
  - volunteer_model
  - score_band
  - total_score
  - total_score_rank
  - batch_name
  - score_gap_to_batch
  - gender
  - strategy_type
  - subject_type
  - subject_list
  - preferred_majors
  - unacceptable_majors
  - preferred_regions
  - negative_regions
  - notes

