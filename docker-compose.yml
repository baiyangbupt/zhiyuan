services:
  zhiyuan-web:
    restart: unless-stopped
    build:
      context: ./zhiyuan-web
      args:
        APP_ENV: deploy
    ports:
      - "3000:28688"
    environment:
      - APP_ENV=deploy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - zhiyuan-agent
      - zhiyuan-rank
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"require('http').get('http://127.0.0.1:28688/', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))\""
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  zhiyuan-agent:
    restart: unless-stopped
    build:
      context: ./zhiyuan-agent
    ports:
      - "8000:8009"
    env_file:
      - ./zhiyuan-agent/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./zhiyuan-agent/logs:/app/logs
      - ./zhiyuan-agent/data:/app/data:ro
    depends_on:
      - zhiyuan-rank
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8009/health', timeout=3).read()\""
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  zhiyuan-rank:
    restart: unless-stopped
    build:
      context: ./zhiyuan-rank
      dockerfile: Dockerfile.fast
    ports:
      - "5001:5001"
    volumes:
      - ./zhiyuan-rank/logs:/app/logs
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:5001/health', timeout=3).read()\""
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  mysql:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: gaotu_zhiyuan
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  mysql_data:
  redis_data:
