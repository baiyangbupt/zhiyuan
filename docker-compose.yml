services:
  zhiyuan-web:
    restart: unless-stopped
    build:
      context: ./zhiyuan-web
      args:
        APP_ENV: deploy
    ports:
      - "3000:28688"
    environment:
      - APP_ENV=deploy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - zhiyuan-agent
      - zhiyuan-rank

  zhiyuan-agent:
    restart: unless-stopped
    build:
      context: ./zhiyuan-agent
    ports:
      - "8000:8009"
    env_file:
      - ./zhiyuan-agent/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./zhiyuan-agent/logs:/app/logs
      - ./zhiyuan-agent/data:/app/data:ro
    depends_on:
      - zhiyuan-rank

  zhiyuan-rank:
    restart: unless-stopped
    build:
      context: ./zhiyuan-rank
      dockerfile: Dockerfile.fast
    ports:
      - "5001:5001"
    volumes:
      - ./zhiyuan-rank/logs:/app/logs

  mysql:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: gaotu_zhiyuan
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  mysql_data:
  redis_data:
