services:
  mysql:
    image: ${CODEX_LOCAL_MYSQL_IMAGE:-docker.m.daocloud.io/library/mysql:8.0}
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-zhiyuan_codex_local}
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    ports:
      - "127.0.0.1:${MYSQL_PORT:-13306}:3306"
    volumes:
      - codex_local_mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  redis:
    image: ${CODEX_LOCAL_REDIS_IMAGE:-docker.m.daocloud.io/library/redis:7-alpine}
    # 事件流承诺的是"至少一次投递 + 可能 resync"，不是零丢失。没有 AOF 的话
    # 进程重启会连事件带计数器一起清空，客户端手上那个 cursor 就永远等不到东西——
    # 所以隔离测试实例必须开 AOF，且用每秒刷盘。
    # 注意：改这里只对**新建**容器生效，已运行的容器需要重新 create。
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-16379}:6379"
    volumes:
      - codex_local_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  codex_local_mysql_data:
    name: zhiyuan_codex_local_mysql_data
  codex_local_redis_data:
    name: zhiyuan_codex_local_redis_data
