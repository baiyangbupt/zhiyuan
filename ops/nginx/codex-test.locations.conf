# Codex 隔离栈的反向代理位置块（Task C2）。
#
# **这不是一份能直接 `include` 的完整 vhost** ✗：
# 上面两段属于 **http 层**（`map` 与 `log_format` 不能塞进 `server` 内 ✗），
# 下面的 `location` 段才是要放进 `test-wwww.gaotuzhiyuan.com` 那个**现有 HTTPS server** 里的 ✓。
# TLS 证书与 `server_name` **复用实际代理配置** ✓，部署前必须 `nginx -t` ✓。
#
# 安全口径：**只放行对话需要的精确路径** ✓——`/inner/`、`/internal/`、`/admin/`、`/debug/`
# 一律 404 ✓，且 `/` 的兜底**不得**把上述前缀漏进上游 ✗（Next 的 rewrite 也要跟着拒 ✗）。
# 上游只监听回环（18290/18291/3201 ✓），数据端口不对外 ✓。

# ── http 层（放 http { } 内）────────────────────────────────────────────────
# map $http_upgrade $codex_connection_upgrade { default upgrade; '' close; }
# log_format codex_no_query '$remote_addr $request_method $uri $status';

# ── server 层（放 server_name test-wwww.gaotuzhiyuan.com 的 HTTPS server 内）──
access_log /var/log/nginx/codex-test-access.log codex_no_query;

# 内网面一律不可达 ✓（即使上游某天多暴露了一个端点 ✗）。
location ~* ^/gaotu-assistant-bot/(inner/|internal/|admin/|debug/) { return 404; }
location ^~ /internal/evidence/ { return 404; }

# 对话 WebSocket（Agent ✓）：必须带 Upgrade 头与长读超时 ✓、关缓冲 ✓。
location = /ws/chat {
    proxy_pass http://127.0.0.1:18291;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $codex_connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 900s;
    proxy_buffering off;
}
location /gaotu-assistant-agent/plus/chat/ {
    proxy_pass http://127.0.0.1:18291;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $codex_connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 900s;
    proxy_buffering off;
}

# 普通 HTTP：只放行对话用的那一段 ✓（其余前缀显式 404 ✓，不留宽泛代理 ✗）。
location /gaotu-assistant-bot/chat/ {
    proxy_pass http://127.0.0.1:18290;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}
location /gaotu-assistant-bot/ { return 404; }
location /gaotu-assistant-agent/ { return 404; }

# 前端（Next ✓）。
location / {
    proxy_pass http://127.0.0.1:3201;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $codex_connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}
