# test-www 标准测试域的代理加固与 /ws/chat 路由（2026-10-06，P0/P1 交付物）。
#
# **这不是完整 vhost** ✗，也**不是要替换现有 test-www 配置** ✗：
# test-www 的生效 vhost 不在本仓库（代理主机上），现有三条上游路由保持不动 ✓：
#   /assistant-pc/                   -> http://10.218.4.10:3001   （Next，标准测试构建）
#   /gaotu-assistant-bot/            -> http://10.218.4.10:18090  （Java 直连，不过 Next）
#   /gaotu-assistant-agent/plus/chat -> http://10.218.4.10:18091  （Agent compat WS）
# 本文件是把**下面这些 location 段插入那个现有 HTTPS server 内**的精确交付 ✓，
# 部署前必须 `nginx -t` ✓，部署后跑 `scripts/smoke-standardtest-hardening.sh` 验收 ✓。
#
# 背景（2026-10-05/06 复核实证）：
# 1. 公网 `/gaotu-assistant-bot/inner/...` 无登录返回 200 数据 ✗——/gaotu-assistant-bot/ 整体
#    直通 Java，而 Java 的 LoginInterceptor 主动排除 `/**/inner/**`（WebConfig.java:42-45），
#    靠网络隔离保护；代理层此前没有任何阻断 ✗。**P0，先阻断再复测** ✓。
# 2. 公网 `wss://test-www.gaotuzhiyuan.com/ws/chat` 当前 404 ✗——V3 WS 路由是后加的，
#    vhost 没有它的 location，请求落进兜底被转给主站 PC Next 应用 ✗。前端构建产物确认
#    浏览器连的就是这个同源地址（`conversationSocket.mjs` + `.env.standardtest`）✓，
#    所以这是 test-www「对话无响应」的第一断点 ✓。**P1** ✓。

# ── 可选：http 层（若 vhost 里已经定义了 $connection_upgrade，跳过本段）────────
# 许多现存配置已有同名 map ✓，先 grep 确认再决定：
#   grep -rn 'connection_upgrade' /etc/nginx/
# 没有的话二选一：
#   (a) 在 http { } 内加：map $http_upgrade $connection_upgrade { default upgrade; '' close; }
#   (b) 本文件里把 Connection 行换成硬编码 `proxy_set_header Connection "upgrade";` ✓
#       ——对下面两个**只接 WS 升级**的 location 是安全的 ✓（没有普通请求会进来）。

# ── 以下全部插入 server_name test-www.gaotuzhiyuan.com 的 HTTPS server 内 ──────

# 【P0】内网面一律 404 ✓。正则 location 优先于前缀 location 匹配 ✓，
# 因此不必动现有 `location /gaotu-assistant-bot/` 的既有块 ✓。
# 用 404 而不是 403 ✓：不向匿名者泄露路径存在性 ✓。
location ~* ^/gaotu-assistant-bot/(inner/|internal/|admin/|debug/) { return 404; }
location ^~ /internal/evidence/ { return 404; }
# 同理加固 agent 前缀（agent 自身没有这些路由，防将来误加 ✓）。
location ~* ^/gaotu-assistant-agent/(inner/|internal/|admin/|debug/) { return 404; }

# 【P1】对话 WebSocket（V3 路由，Agent 18091）：必须带 Upgrade 头与长读超时 ✓、关缓冲 ✓。
# 精确匹配 ✓：只吃 /ws/chat（query string 不影响 = 匹配 ✓），不给其它路径扩面 ✗。
# 上游与现有 agent 路由同机：10.218.4.10:18091 ✓。
location = /ws/chat {
    proxy_pass http://10.218.4.10:18091;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;
    proxy_buffering off;
}

# 说明：无票/错 Origin 时 Agent 在 accept 前拒握手 → 客户端看到 HTTP 403 ✓（不是 101 ✗），
# 这是预期的验票行为 ✓，`smoke-standardtest-hardening.sh` 会断言这一条 ✓。

# ── 部署与验收 ───────────────────────────────────────────────────────────────
# 1. nginx -t && nginx -s reload（代理主机）。
# 2. bash scripts/smoke-standardtest-hardening.sh（本机，只读探针）：
#    - 匿名 /gaotu-assistant-bot/inner/... 期望 404（部署前是 200 JSON ✗）
#    - 匿名带 Upgrade 的 /ws/chat 期望 403（部署前 404 HTML ✗）
#    - /assistant-pc/login、取票 401、agent compat 403 等既有行为不得回归 ✓
# 3. 带登录态的真实验收（浏览器 Network）：取票 200 → WSS 101 → turn 事件 → 终态 ✓。
#
# 注意（封堵 inner 的已知破坏面，需在部署同批处理）：
# - 浏览器工作台的历史 inner 调用由 facade 迁移接管（`/gaotu-assistant-bot/chat/{tenant}/planning/...`）✓；
#   未迁移完的调用封堵后必 404 ✗。
# - `ops/release-smoke.sh` remote 模式（:257/259/271-273）与 `ops/healthcheck.sh:142`
#   的 "server remote" 探测打的就是公网 inner ✗——封堵后要么把 SERVER_BASE 换成直连
#   后端地址（local 模式即如此 ✓），要么这些检查会红 ✓。
# - `zhiyuan-web/tests/e2e/browser-smoke.mjs:7` 走 127.0.0.1:18090 直连 ✓，不受影响 ✓。
# - 核查代理访问日志里匿名 /inner 的历史命中（安全口径，只做聚合计数，不做会话枚举 ✗）。
